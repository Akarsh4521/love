<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Proposal</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #fff0f5;
      text-align: center;
      padding-top: 100px;
    }
    h1 {
      color: #c71585;
    }
    .btn {
      font-size: 18px;
      padding: 10px 20px;
      margin: 10px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
    }
    .yes {
      background-color: #ff69b4;
      color: white;
    }
    .no {
      background-color: #d3d3d3;
      color: black;
    }
    .roses {
      font-size: 40px;
      animation: fall 3s infinite linear;
      position: absolute;
    }
    @keyframes fall {
      0% { transform: translateY(-100px); opacity: 1; }
      100% { transform: translateY(100vh); opacity: 0; }
    }
  </style>
</head>
<body>

  <h1>Will you be my girlfriend Rishita? ❤️</h1>
  <button class="btn yes" onclick="showRoses()">Yes</button>
  <button class="btn no" onclick="alert('Chup Chap yes kriye ')">No</button>

  <script>
    function showRoses() {
      for (let i = 0; i < 50; i++) {
        const rose = document.createElement("div");
        rose.className = "roses";
        rose.textContent = "🌹";
        rose.style.left = Math.random() * 100 + "vw";
        rose.style.animationDuration = 2 + Math.random() * 3 + "s";
        document.body.appendChild(rose);
        setTimeout(() => rose.remove(), 5000);
      }
    }
  </script>

</body>
</html>
